# Runs the tests (npm test) on pushes to main and on pull requests.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ubuntu-latest comes with Google Chrome, which test/lib.mjs finds on its own.
      - run: npm test
        env:
          TEST_BROWSER: "1"
