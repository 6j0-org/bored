<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" preserveAspectRatio="none">
  <!-- The planed board: the original cartoon board (a CSS drawing until board.webp) squared off and smoothed, in the
       app's wood browns. It's stretched to fit the letters, so the outlines don't scale with it. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bd6d31"/>
      <stop offset=".55" stop-color="#a05a28"/>
      <stop offset="1" stop-color="#8a4720"/>
    </linearGradient>
  </defs>
  <!-- the board's thickness, under the face -->
  <rect x="4" y="14" width="472" height="182" rx="7" fill="#6b3516" stroke="#472610" stroke-width="3" vector-effect="non-scaling-stroke"/>
  <rect x="4" y="4" width="472" height="176" rx="7" fill="url(#face)"/>
  <!-- grain -->
  <g fill="none" stroke="#5e2f12" stroke-linecap="round" vector-effect="non-scaling-stroke">
    <path d="M14 38C120 30 210 44 300 36S440 30 466 40" stroke-opacity=".28" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <path d="M14 70C90 64 160 76 250 68S400 60 466 72" stroke-opacity=".2" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <path d="M14 104C110 98 190 110 280 102S420 96 466 106" stroke-opacity=".26" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <path d="M14 140C100 134 200 146 300 136S430 132 466 142" stroke-opacity=".18" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <path d="M14 162C130 158 240 168 340 160S440 158 466 164" stroke-opacity=".22" stroke-width="2" vector-effect="non-scaling-stroke"/>
  </g>
  <!-- a knot, low on the right, where the original had it -->
  <ellipse cx="356" cy="128" rx="26" ry="8" fill="#7a3f17" fill-opacity=".55"/>
  <ellipse cx="356" cy="128" rx="40" ry="13" fill="none" stroke="#7a3f17" stroke-opacity=".35" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <!-- the planed edge catching the light, and the outline -->
  <path d="M14 10H466" stroke="#f6ecda" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <rect x="4" y="4" width="472" height="176" rx="7" fill="none" stroke="#472610" stroke-width="3" vector-effect="non-scaling-stroke"/>
</svg>
