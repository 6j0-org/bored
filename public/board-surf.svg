    <clipPath id="shape"><path d="M18 100C18 52 70 18 250 14C430 10 560 40 626 100C560 160 430 190 250 186C70 182 18 148 18 100Z"/></clipPath>
  </defs>
  <path d="M18 100C18 52 70 18 250 14C430 10 560 40 626 100C560 160 430 190 250 186C70 182 18 148 18 100Z" fill="url(#deck)"/>
  <g clip-path="url(#shape)" stroke-linecap="round">
