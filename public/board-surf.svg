<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" preserveAspectRatio="none">
  <!-- The surfboard: a light wooden longboard seen from above, tail on the left and nose on the right, with a darker
       stringer down the middle, bands of yellow, orange, coral, and plum across the nose, and three matching pinstripes
       at the tail. It's stretched to fit the letters, so the outlines don't scale. -->
